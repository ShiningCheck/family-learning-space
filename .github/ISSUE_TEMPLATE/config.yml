# ============================================================
# Issue 模板选择器配置
# 关闭空白 Issue，引导所有反馈走结构化表单。
# ============================================================
blank_issues_enabled: false

contact_links:
  # 注意：把下面 url 中的 YOUR_GITHUB_NAME / YOUR_REPO_NAME 改成你自己的仓库地址
  - name: 反馈通道使用说明
    url: https://github.com/YOUR_GITHUB_NAME/YOUR_REPO_NAME/blob/main/feedback-relay/README.md
    about: 应用内「反馈」按钮如何工作、自动 Issue 与飞书通知的说明，请先阅读这里
  # 注意：同样改成你自己的仓库地址（Issue 列表页，可先搜一下是否已有人提过）
  - name: 先搜一下已有反馈
    url: https://github.com/YOUR_GITHUB_NAME/YOUR_REPO_NAME/issues?q=is%3Aissue+label%3A%22%E7%94%A8%E6%88%B7%E5%8F%8D%E9%A6%88%22
    about: 提交前建议先搜索带「用户反馈」标签的已有 Issue，避免重复
