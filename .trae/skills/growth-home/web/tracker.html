<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡</title>
<script src="/vendor/pinyin-pro.js"></script>
<script src="/vendor/themes.js"></script>
<script src="/vendor/tts.js"></script>
<script src="/vendor/voice.js"></script>
<script src="/vendor/feedback.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Yuanti SC", "YouYuan", "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: var(--paper, #FFF6E9);
    background-image: radial-gradient(var(--dot, #FFE0B8) 2.5px, transparent 2.5px);
    background-size: 28px 28px;
    color: var(--ink, #4A3B2A);
    padding-bottom: 50px;
    transition: background-color 0.35s ease, color 0.35s ease;
  }
  ruby { ruby-align: center; }
  rt { font-size: 0.5em; color: var(--soft, #B08968); font-weight: normal; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px; }

  .hero {
    margin: 10px 0 12px;
    background: var(--c, var(--hero-a, #4DABF7));
    border: 4px solid var(--edge, #4A3B2A);
    border-radius: 26px;
    box-shadow: 0 8px 0 var(--edge, #4A3B2A);
    color: #fff;
    text-align: center;
    padding: 14px 16px 12px;
    position: relative;
    overflow: hidden;
  }
  .hero .deco { position: absolute; font-size: 22px; opacity: 0.5; }
  .hero-emoji { font-size: 42px; line-height: 1.15; text-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  .hero h1 { font-size: 26px; font-weight: 900; margin-top: 2px; line-height: 1.6; }
  .hero h1 rt { color: rgba(255,255,255,0.85); }
  .hero .goal { font-size: 15px; margin-top: 2px; font-weight: 700; opacity: 0.95; line-height: 1.7; }

  .card {
    background: var(--card, #fff); border: 4px solid var(--edge, #4A3B2A); border-radius: 24px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.18);
    padding: 14px; margin-bottom: 12px;
    transition: background-color 0.35s ease, border-color 0.35s ease;
  }
  .sync-tip { margin-top: 8px; font-size: 12px; font-weight: 800; color: var(--soft, #8D7357); }
  .sync-tip.ok { color: #2B8A3E; }
  .sync-tip.warn { color: #E8590C; }
  .streak-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .streak { font-size: 20px; font-weight: 900; color: var(--acc-deep, #E8590C); }
  .dots { display: flex; gap: 8px; }
  .dot { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--soft, #8D7357); }
  .dot i { width: 20px; height: 20px; border-radius: 50%; display: block; border: 2.5px solid var(--edge, #4A3B2A); background: var(--line, #FFF1DB); }
  .dot.ok i { background: #51CF66; }
  .dot.today { font-weight: 900; color: var(--ink, #4A3B2A); }

  .big-area { text-align: center; padding: 14px 0 6px; }
  .big-btn {
    width: 180px; height: 180px; border-radius: 50%;
    border: 5px solid var(--edge, #4A3B2A);
    background: var(--c, var(--hero-a, #4DABF7));
    box-shadow: 0 10px 0 var(--edge, #4A3B2A);
    font-size: 64px; cursor: pointer;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s;
    color: #fff;
  }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--edge, #4A3B2A); }
  .big-btn .lbl { font-size: 22px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .big-btn.done { background: #69DB7C; }
  .hint { margin-top: 12px; font-size: 16px; color: var(--soft, #8D7357); font-weight: 700; }

  .note-box { margin-top: 16px; text-align: left; }
  .note-box label { font-size: 17px; font-weight: 800; display: block; margin-bottom: 8px; line-height: 1.8; }
  .note-row { display: flex; gap: 10px; }
  .note-row input {
    flex: 1; font-size: 18px; padding: 12px 14px;
    border: 3.5px solid var(--edge, #4A3B2A); border-radius: 16px;
    background: var(--card, #FFFDF7); font-family: inherit; color: var(--ink, #4A3B2A);
    min-width: 0;
  }
  .note-row button {
    flex: none; font-size: 18px; font-weight: 900; font-family: inherit;
    border: 3.5px solid var(--edge, #4A3B2A); border-radius: 16px;
    background: #FFD43B; color: #4A3B2A; padding: 12px 18px;
    box-shadow: 0 4px 0 var(--edge, #4A3B2A); cursor: pointer;
  }
  .note-row button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge, #4A3B2A); }
  .note-show { margin-top: 12px; font-size: 17px; background: var(--line, #FFF9DB); border-radius: 14px; padding: 10px 14px; line-height: 1.9; }
  .note-voice { margin-top: 12px; }
  .voice-show { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .v-play {
    flex: none; border: 3px solid var(--edge, #4A3B2A); border-radius: 999px;
    background: var(--line, #FFF9DB); color: var(--ink, #4A3B2A);
    padding: 8px 16px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit;
  }
  .v-play:active { transform: translateY(2px); }
  .v-text { font-size: 15px; color: var(--soft, #8D7357); font-weight: 700; line-height: 1.8; }

  .history-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .history-head .h-title { font-size: 19px; font-weight: 900; line-height: 1.8; }
  .history-head .h-count { font-size: 14px; color: var(--soft, #8D7357); font-weight: 800; }
  .h-item {
    display: flex; align-items: center; gap: 12px;
    border: 3px solid var(--edge, #4A3B2A); border-radius: 18px;
    padding: 10px 12px; margin-bottom: 10px;
    background: var(--card, #FFFDF7);
  }
  .h-item:last-child { margin-bottom: 0; }
  .h-item .h-date { flex: none; width: 56px; text-align: center; }
  .h-item .h-date .d-day { font-size: 24px; font-weight: 900; line-height: 1.05; color: var(--acc-deep, #E8590C); }
  .h-item .h-date .d-wk { font-size: 12px; color: var(--soft, #8D7357); font-weight: 700; }
  .h-item .h-body { flex: 1; min-width: 0; }
  .h-item .h-body .h-note { font-size: 15px; line-height: 1.6; word-break: break-word; }
  .h-tag { flex: none; font-size: 12px; font-weight: 800; color: #2B8A3E; background: #E7FBEA; border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  .h-tag.note-only { color: #B0512B; background: #FFF0E0; }
  .h-empty { text-align: center; color: var(--soft, #8D7357); font-size: 15px; padding: 12px 0; line-height: 1.9; }
  .hist-toggle {
    display: block; width: 100%; margin: 2px 0 12px;
    font-family: inherit; font-size: 17px; font-weight: 900; color: var(--ink, #4A3B2A);
    background: var(--line, #FFF1DB); border: 3.5px solid var(--edge, #4A3B2A); border-radius: 16px;
    padding: 11px 16px; cursor: pointer;
    box-shadow: 0 4px 0 var(--edge, #4A3B2A);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .hist-toggle:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge, #4A3B2A); }

  .progress-line { font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 12px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    border: 3.5px solid var(--edge, #4A3B2A); border-radius: 20px;
    padding: 14px 16px; margin-bottom: 12px;
    background: var(--card, #FFFDF7); cursor: pointer;
    transition: transform 0.12s ease, background 0.2s;
    user-select: none;
  }
  .item:active { transform: scale(0.98); }
  .item.done { background: #E7FBEA; }
  .item .i-emoji { font-size: 34px; flex: none; }
  .item .i-name { font-size: 21px; font-weight: 800; flex: 1; line-height: 1.9; }
  .item.done .i-name { color: #2B8A3E; }
  .item .i-check {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    border: 3.5px solid var(--edge, #4A3B2A); background: var(--card, #fff);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .item.done .i-check { background: #51CF66; }

  .prow {
    display: flex; align-items: center; gap: 12px;
    border: 3.5px solid var(--edge, #4A3B2A); border-radius: 20px;
    padding: 14px 16px; margin-bottom: 12px;
    background: var(--card, #FFFDF7);
  }
  .prow .i-emoji { font-size: 34px; flex: none; }
  .pbook { flex: 1; min-width: 0; }
  .pbook .i-name { font-size: 21px; font-weight: 800; line-height: 1.9; }
  .p-count { font-size: 15px; color: var(--soft, #8D7357); font-weight: 700; margin-top: 2px; }
  .p-btn {
    flex: none; font-family: inherit; font-size: 16px; font-weight: 900;
    border: 3px solid var(--edge, #4A3B2A); border-radius: 14px;
    padding: 9px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--edge, #4A3B2A);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .p-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge, #4A3B2A); }
  .p-btn.plus { background: #69DB7C; color: #2B8A3E; }
  .p-btn.minus { background: var(--line, #FFF1DB); color: #C92A2A; }
  .p-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

  .book {
    border: 3.5px solid var(--edge, #4A3B2A); border-radius: 20px;
    background: var(--card, #FFFDF7); margin-bottom: 12px; overflow: hidden;
  }
  .book-head {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer;
    user-select: none;
  }
  .book-head .i-emoji { font-size: 32px; flex: none; }
  .book-head .b-title { flex: 1; min-width: 0; }
  .book-head .b-name { font-size: 20px; font-weight: 800; line-height: 1.8; }
  .book-head .b-sub { font-size: 13px; color: var(--soft, #8D7357); font-weight: 700; }
  .book-head .b-arrow { flex: none; font-size: 20px; transition: transform 0.2s ease; }
  .book.open .b-arrow { transform: rotate(180deg); }
  .chapters { display: none; border-top: 2.5px dashed var(--line, #FFF1DB); padding: 10px 12px 12px; }
  .book.open .chapters { display: block; }
  .chap {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-radius: 14px; cursor: pointer; user-select: none;
  }
  .chap:active { background: var(--line, #FFF1DB); }
  .chap .c-check {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid var(--edge, #4A3B2A); background: var(--card, #fff);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .chap.done .c-check { background: #51CF66; color: #fff; }
  .chap .c-name { flex: 1; font-size: 17px; line-height: 1.7; font-weight: 700; }
  .chap.done .c-name { color: #2B8A3E; text-decoration: line-through; }
  .empty-tip { text-align: center; font-size: 14px; color: var(--soft, #8D7357); font-weight: 700; padding: 10px 0 6px; line-height: 1.8; }

  .rec-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .rec-title { font-size: 19px; font-weight: 900; }
  .rec-hint { font-size: 13px; color: var(--soft, #8D7357); font-weight: 700; }
  .rec-main { display: flex; align-items: center; gap: 14px; }
  .rec-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
    border: 4px solid var(--edge, #4A3B2A); border-radius: 20px;
    background: #FF922B; color: #fff; padding: 14px;
    font-family: inherit; font-size: 19px; font-weight: 900; cursor: pointer;
    box-shadow: 0 5px 0 var(--edge, #4A3B2A);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s;
  }
  .rec-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--edge, #4A3B2A); }
  .rec-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .rec-btn.recording { background: #FA5252; animation: recPulse 1.1s infinite; }
  @keyframes recPulse {
    0%, 100% { box-shadow: 0 5px 0 var(--edge, #4A3B2A), 0 0 0 0 rgba(250, 82, 82, 0.5); }
    50% { box-shadow: 0 5px 0 var(--edge, #4A3B2A), 0 0 0 16px rgba(250, 82, 82, 0); }
  }
  .rec-ico { font-size: 24px; }
  .rec-lbl { text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15); }
  .rec-timer { font-size: 26px; font-weight: 900; color: #FA5252; font-variant-numeric: tabular-nums; }
  .rec-timer.hidden { display: none; }
  .rec-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .rec-empty { text-align: center; color: var(--soft, #8D7357); font-size: 14px; padding: 8px 0; }
  .rec-item {
    display: flex; align-items: center; gap: 10px;
    border: 2.5px solid var(--edge, #4A3B2A); border-radius: 14px;
    padding: 9px 12px; background: var(--card, #FFFDF7);
  }
  .rec-play, .rec-del {
    flex: none; border: none; background: none; font-size: 20px; cursor: pointer; padding: 4px;
  }
  .rec-meta { flex: 1; font-size: 15px; font-weight: 700; color: var(--ink, #4A3B2A); }

  #celebrate {
    position: fixed; inset: 0; z-index: 99;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(255, 246, 233, 0.92);
    background: color-mix(in srgb, var(--paper, #FFF6E9) 92%, transparent);
  }
  #celebrate.hidden { display: none; }
  .cel-emoji { font-size: 92px; animation: bounce 0.65s infinite alternate; }
  .cel-msg { font-size: 30px; font-weight: 900; color: var(--acc-deep, #E8590C); text-align: center; line-height: 1.8; padding: 0 20px; }
  @keyframes bounce { from { transform: translateY(0) scale(1); } to { transform: translateY(-22px) scale(1.1); } }

  #errTip { display: none; text-align: center; color: #C92A2A; font-size: 17px; line-height: 1.9; padding: 40px 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="errTip"></div>
  <div id="app" style="display:none">
    <header class="hero" id="hero">
      <span class="deco" style="left:12px;top:12px">✨</span>
      <span class="deco" style="right:14px;bottom:12px">🌟</span>
      <div class="hero-emoji" id="heroEmoji"></div>
      <h1 id="heroName"></h1>
      <div class="goal" id="heroGoal"></div>
    </header>

    <div class="card">
      <div class="streak-row">
        <span class="streak" id="streak"></span>
        <div class="dots" id="dots"></div>
      </div>
      <div class="sync-tip" id="syncTip"></div>
    </div>

    <div class="card" id="mainCard"></div>

    <div class="card" id="recCard">
      <div class="rec-head">
        <span class="rec-title">🎙️ 录音</span>
        <span class="rec-hint" id="recHint">读一段、唱一段，录下来会存到服务器，还会自动变成文字</span>
      </div>
      <div id="recBox"></div>
      <div class="rec-list" id="recList"></div>
    </div>

    <!-- 「查看打卡记录」放在打卡模块（大按钮 + 一句话 + 录音）下面：
         先打卡，往下才是翻记录，不用先跨过记录入口才看到打卡按钮 -->
    <button class="hist-toggle" id="histToggle" type="button">📜 查看打卡记录</button>

    <div class="card" id="historyCard" style="display:none"></div>
  </div>
</div>

<div id="celebrate" class="hidden">
  <div class="cel-emoji" id="celEmoji">🎉</div>
  <div class="cel-msg" id="celMsg"></div>
</div>

<script>
const TAB_ID = new URLSearchParams(location.search).get('id') || '';
let CONFIG = {};
let TAB = null;
let BOOKLIST = [];
let records = {};
let syncing = false;
let syncState = 'idle';    // 'idle' 还没同步过 / 'syncing' 正在拉 / 'ok' 已同步 / 'offline' 连不上
let pendingPush = false;   // 同步过程中收到的改动，等这轮结束再推
let pushTimer = null;
let pullTimer = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function rubyHtml(text) {
  let out = '';
  for (const ch of Array.from(text || '')) {
    if (/[\u4e00-\u9fff]/.test(ch)) {
      let py = '';
      try { if (window.pinyinPro) py = pinyinPro.pinyin(ch, { toneType: 'symbol' }); } catch (e) { py = ''; }
      out += py ? '<ruby>' + ch + '<rp>(</rp><rt>' + escapeHtml(py) + '</rt><rp>)</rp></ruby>' : ch;
    } else {
      out += escapeHtml(ch);
    }
  }
  return out;
}

function dateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayStr() { return dateStr(new Date()); }
function nowTs() { return Date.now(); }

function childTag() { return CONFIG.childName || 'child'; }
function storeKey() { return 'gh_' + TAB_ID + '_' + childTag(); }
function progressKey() { return 'ghp_' + TAB_ID + '_' + childTag(); }
function openKey() { return 'ghb_open_' + TAB_ID + '_' + childTag(); }

function loadRecords() {
  try { records = JSON.parse(localStorage.getItem(storeKey()) || '{}') || {}; } catch (e) { records = {}; }
}
function saveRecords() {
  try { localStorage.setItem(storeKey(), JSON.stringify(records)); } catch (e) { /* 隐私模式等，忽略 */ }
}

// 书单进度：{ 书id: { chapters: [章节下标], ts: 改动时间 } }
// 兼容旧格式（纯数组，无时间戳）。
function normProgress(raw) {
  const out = {};
  Object.keys(raw || {}).forEach(id => {
    const v = raw[id];
    if (Array.isArray(v)) out[id] = { chapters: v.slice(), ts: 0 };
    else if (v && typeof v === 'object') out[id] = { chapters: (v.chapters || []).slice(), ts: Number(v.ts) || 0 };
  });
  return out;
}
function loadProgress() {
  try { return normProgress(JSON.parse(localStorage.getItem(progressKey()) || '{}')); } catch (e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(progressKey(), JSON.stringify(p)); } catch (e) { /* 忽略 */ }
}
function chapList(p, bookId) { return (p[bookId] && p[bookId].chapters) || []; }

// 展开着的书：记在本机，勾选章节后依然保持展开，只有点书头才收起
let openBooks = new Set();
function loadOpen() {
  try { openBooks = new Set(JSON.parse(localStorage.getItem(openKey()) || '[]')); } catch (e) { openBooks = new Set(); }
}
function saveOpen() {
  try { localStorage.setItem(openKey(), JSON.stringify(Array.from(openBooks))); } catch (e) { /* 忽略 */ }
}

// ===== 跨设备同步 =====
// 打卡状态以服务器上的 data/tracker_state.json 为准（手机、平板、电脑看到同一份），
// localStorage 只是断网时的本地缓存；合并规则是「同一天/同一本书按时间戳取新」。
function stampOf(o) { return Number((o && o.ts) || 0) || 0; }

function mergeStamped(localMap, remoteMap) {
  const out = Object.assign({}, localMap || {});
  Object.keys(remoteMap || {}).forEach(k => {
    const rv = remoteMap[k];
    if (!rv || typeof rv !== 'object') return;
    const lv = out[k];
    if (!lv || stampOf(rv) >= stampOf(lv)) out[k] = rv;
  });
  return out;
}

// 书单进度：按时间戳取新；两边都没有时间戳（升级前的旧数据）时取并集，不丢已读章节
function mergeProgress(localMap, remoteMap) {
  const out = Object.assign({}, localMap || {});
  Object.keys(remoteMap || {}).forEach(k => {
    const rv = remoteMap[k];
    if (!rv || typeof rv !== 'object') return;
    const lv = out[k];
    if (!lv) { out[k] = rv; return; }
    const lt = stampOf(lv), rt = stampOf(rv);
    if (lt === 0 && rt === 0) {
      const set = new Set((lv.chapters || []).concat(rv.chapters || []));
      out[k] = { chapters: Array.from(set).sort((a, b) => a - b), ts: 0 };
    } else if (rt >= lt) {
      out[k] = rv;
    }
  });
  return out;
}

function sigOf(recs, prog) {
  return JSON.stringify({
    r: Object.keys(recs || {}).sort().map(k => {
      const v = recs[k] || {};
      return [k, !!v.done, v.note || '', (v.items || []).slice().sort()];
    }),
    p: Object.keys(prog || {}).sort().map(k => [k, ((prog[k] || {}).chapters || []).slice().sort((a, b) => a - b)])
  });
}

function localSignature() { return sigOf(records, loadProgress()); }

function setSyncTip(state) {
  // 记一份同步状态：记录本（查看打卡记录）要据此说明"还没读到 / 读到了但没有 / 连不上"，
  // 不能在服务器还没回话时就一口咬定"还没有打卡记录"。
  syncState = state;
  const el = document.getElementById('syncTip');
  if (!el) return;
  if (state === 'syncing') { el.className = 'sync-tip'; el.textContent = '⏳ 正在同步…'; }
  else if (state === 'ok') { el.className = 'sync-tip ok'; el.textContent = '☁️ 已同步（换台设备打开也是这份数据）'; }
  else { el.className = 'sync-tip warn'; el.textContent = '⚠️ 暂时连不上服务器，先存在本机，联网后自动补上'; }
}

async function fetchRemoteState() {
  const res = await fetch('/api/tracker?tab=' + encodeURIComponent(TAB_ID), { cache: 'no-store' });
  if (!res.ok) throw new Error('http ' + res.status);
  return await res.json();
}

/** 把服务器状态并进本地；返回本地是否发生变化 */
function adoptRemote(data, allowRender) {
  if (!data || !data.ok) return false;
  const before = localSignature();
  records = mergeStamped(records, data.records || {});
  const merged = mergeProgress(loadProgress(), normProgress(data.progress));
  saveRecords();
  saveProgress(merged);
  if (before === localSignature()) return false;
  if (allowRender) refreshAll();
  return true;
}

/** 本地比服务器新（或服务器还没有）时，把本地补上去 */
async function pushState() {
  // 正在同步（例如刚打开页面那一次拉取还没回来）：不能把这次改动丢掉，
  // 记下来，等手上这轮结束立刻补推。
  if (syncing) { pendingPush = true; return; }
  syncing = true;
  pendingPush = false;
  setSyncTip('syncing');
  try {
    const res = await fetch('/api/tracker', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tab: TAB_ID, records: records, progress: loadProgress() })
    });
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    adoptRemote(data, false);
    setSyncTip('ok');
  } catch (e) {
    setSyncTip('offline');
  } finally {
    syncing = false;
    if (pendingPush) { pendingPush = false; schedulePush(120); }
  }
}

function schedulePush(delay) {
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { pushTimer = null; pushState(); }, delay || 300);
}

async function syncNow(allowRender) {
  if (syncing) return false;
  syncing = true;
  try {
    const data = await fetchRemoteState();
    const changed = adoptRemote(data, allowRender);
    syncing = false;
    setSyncTip('ok');
    if (sigOf(records, loadProgress()) !== sigOf(data.records || {}, normProgress(data.progress))) {
      await pushState();
    }
    return changed;
  } catch (e) {
    syncing = false;
    setSyncTip('offline');
    return false;
  }
}

function startSyncLoop() {
  if (pullTimer) clearInterval(pullTimer);
  pullTimer = setInterval(() => { if (!document.hidden) syncNow(true); }, 12000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(true); });
  window.addEventListener('focus', () => syncNow(true));
  window.addEventListener('online', () => syncNow(true));
}


function dayDone(rec) {
  if (!rec) return false;
  if (TAB.type === 'single') return !!rec.done;
  if (TAB.type === 'progress') return !!rec.done;
  return (rec.items || []).length > 0;
}

// 这一天有没有「留下记录」——打卡、写的一句话、录的一段音都算。
// 记录本（查看打卡记录）按它列出每一天：只录了音没点大按钮的那天也要看得见，
// 只点了大按钮的叫「已打卡」，只留了文字/录音的叫「有记录」。
function dayRecorded(rec) {
  if (!rec) return false;
  if (dayDone(rec)) return true;
  if (rec.note && String(rec.note).trim()) return true;
  if (rec.voice && rec.voice.url) return true;
  if ((rec.items || []).length > 0) return true;
  if ((rec.chapters || []).length > 0) return true;
  return false;
}

function calcStreak() {
  let streak = 0;
  const d = new Date();
  if (!dayDone(records[dateStr(d)])) d.setDate(d.getDate() - 1);
  while (dayDone(records[dateStr(d)])) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

let voices = [];
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = speechSynthesis.getVoices();
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text) {
  // 优先播放电脑端预生成的配音音频（data/tts/），没有对应音频时自动降级浏览器朗读
  if (window.TTS) { TTS.speak(text, 'zh'); return; }
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    const zh = voices.filter(v => v.lang && v.lang.toLowerCase().indexOf('zh') === 0);
    if (zh.length) u.voice = zh[0];
    u.lang = zh.length ? zh[0].lang : 'zh-CN';
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }, 50);
}

function showCelebration(emoji, msg) {
  document.getElementById('celEmoji').textContent = emoji;
  document.getElementById('celMsg').innerHTML = rubyHtml(msg);
  const cel = document.getElementById('celebrate');
  cel.classList.remove('hidden');
  speak(msg);
  setTimeout(() => cel.classList.add('hidden'), 2600);
}

// 书单勾完一章：念出「这一章叫什么」（不是笼统的"读完一章"），后面接一句"读完啦！"。
// 章节名的音频由 voice-dubbing 技能从 booklist.json 生成，新书单加进去会自动补上；
// 清单里没有这条音频时才退回浏览器朗读。
function speakChapter(bookId, idx) {
  const book = BOOKLIST.find(b => b.id === bookId);
  const name = ((book && book.chapters) || [])[idx] || ('第 ' + (idx + 1) + ' 章');
  if (window.TTS && TTS.speakSeq) { TTS.speakSeq([name, '读完啦！'], 'zh'); return; }
  speak(name + '，读完啦！');
}

// ===== 录音（存到门户服务器 + 自动识别成文字）=====
// 用的是全站通用的 voice.js：录音 / 用手机录音机录好再选文件上传 -> 服务器落盘 -> 自动转文字，
// 文字和语音都留档（原来是只存在本机 IndexedDB 里，换台设备就听不到了）。
let readVoiceCtl = null;

function initRecorder() {
  if (!window.Voice) return;
  readVoiceCtl = Voice.attach({
    mount: '#recBox',
    scope: 'tracker-read-' + TAB_ID,
    lang: 'zh',
    meta: { page: '打卡页', tab: TAB_ID }
  });
  Voice.listInto('#recList', {
    scope: 'tracker-read-' + TAB_ID,
    limit: 30,
    empty: '还没有录音，读一段课文录下来吧 🎙️',
    onDeleted: id => clearVoiceRef(id)   // 顺手把打卡记录里挂的同一条语音引用也清掉
  });
}

// ===== 「一句话记录」也能说 =====
function voiceShowInner(v) {
  if (!v || !v.url) return '';
  return '<div class="voice-show">' +
    '<button class="v-play" type="button" data-url="' + escapeHtml(v.url) + '">▶️ 听我录的</button>' +
    '<span class="v-text">' + escapeHtml(v.text || '（这段没听清）') + '</span>' +
    '</div>';
}

function voiceRowHtml(rec) {
  return '<div class="note-voice" id="noteVoice"></div>' +
    '<div id="noteVoiceShow">' + voiceShowInner(rec && rec.voice) + '</div>';
}

function bindVoicePlay(root) {
  if (!root) return;
  root.querySelectorAll('.v-play').forEach(b => b.addEventListener('click', () => {
    const url = b.getAttribute('data-url');
    if (!url) return;
    try { if (window.__vAudio) window.__vAudio.pause(); } catch (e) { /* 忽略 */ }
    const a = new Audio(url);
    window.__vAudio = a;
    // 音频文件万一不在了（录音被清过、换过电脑），要看得见地说一句，
    // 不能点了没声音也没反应，让人以为是页面坏了。
    a.addEventListener('error', () => {
      const tip = b.parentNode && b.parentNode.querySelector('.v-text');
      if (tip) tip.textContent = '（这段录音的音频文件不在了，文字还留着）';
    });
    a.play().catch(() => {});
  }));
}

/**
 * 删掉一段录音时，把打卡记录里挂的那条 voice 引用一起清掉，并推回服务器。
 * 不清的话，这一天在「查看打卡记录」里还会留着一行（"有记录"）和已经删掉的文字，
 * 看起来就像"录音删了、记录没删干净"。
 * 注意：这一天不能直接删键，只能留一个只剩 ts 的空壳 —— 服务器按时间戳合并、取并集，
 * 键没了会被服务器那份再带回来；空壳的 ts 更新，才压得过旧记录，"删除"才能同步到别的设备。
 */
function clearVoiceRef(id) {
  if (!id) return;
  let touched = false;
  Object.keys(records).forEach(k => {
    const r = records[k];
    if (r && r.voice && r.voice.id === id) {
      const rest = Object.assign({}, r);
      delete rest.voice;
      rest.ts = nowTs();
      records[k] = rest;
      touched = true;
    }
  });
  if (!touched) return;
  saveRecords();
  // 只清掉页面上那块"▶️ 听我录的 + 文字"，不动主卡（家长可能正在输入框里改字）
  const box = document.getElementById('noteVoiceShow');
  if (box) box.innerHTML = '';
  renderStreak();
  renderHistory();
  schedulePush();
}

function mountNoteVoice() {
  if (!window.Voice || !document.getElementById('noteVoice')) return;
  Voice.attach({
    mount: '#noteVoice',
    scope: 'tracker-note-' + TAB_ID,
    lang: 'zh',
    autoFill: '#noteInput',
    compact: true,
    meta: { page: '打卡页', tab: TAB_ID },
    onSaved: rec => {
      const key = todayStr();
      const r = records[key] || {};
      r.voice = { id: rec.id, url: rec.url, text: rec.text || '', ts: nowTs() };
      r.ts = nowTs();
      records[key] = r;
      saveRecords();
      schedulePush();
      const box = document.getElementById('noteVoiceShow');
      if (box) { box.innerHTML = voiceShowInner(r.voice); bindVoicePlay(box); }
    },
    onDeleted: clearVoiceRef
  });
}

function renderStreak() {
  const streak = calcStreak();
  document.getElementById('streak').textContent = streak >= 2 ? '🔥 连续 ' + streak + ' 天' : '🌱 今天开始打卡吧';
  const box = document.getElementById('dots');
  const names = ['日', '一', '二', '三', '四', '五', '六'];
  let html = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = dateStr(d);
    const ok = dayDone(records[key]);
    html += '<span class="dot' + (ok ? ' ok' : '') + (i === 0 ? ' today' : '') + '">' +
      '<i></i>' + (i === 0 ? '今' : names[d.getDay()]) + '</span>';
  }
  box.innerHTML = html;
}

function toggleHistory() {
  const box = document.getElementById('historyCard');
  const opening = box.style.display === 'none';
  box.style.display = opening ? 'block' : 'none';
  renderHistory();
  // 打开记录本时顺手跟服务器对一次：这台设备本机还是空的（新手机 / 清过浏览器缓存）也能立刻读到真实记录，
  // 不会出现"点开是空的"。
  if (opening) syncNow(true);
}

function renderHistory() {
  const box = document.getElementById('historyCard');
  const btn = document.getElementById('histToggle');
  // 打卡的日子 + 只留了一句话/一段录音的日子都算"有记录"，一起列出来
  const days = Object.keys(records).filter(k => dayRecorded(records[k])).sort().reverse();
  const open = box.style.display !== 'none';
  if (btn) btn.textContent = open ? '📜 收起打卡记录' : ('📜 查看打卡记录' + (days.length ? '（' + days.length + ' 天）' : ''));
  if (!days.length) {
    // 空的也分三种：还没读到服务器、连不上服务器、真的还没打过卡。
    // 不能一上来就说"还没有打卡记录"——那会让人以为记录丢了。
    let msg;
    if (syncState === 'ok') msg = '还没有打卡记录，今天开始第一次吧！';
    else if (syncState === 'offline') msg = '⚠️ 暂时连不上服务器，这台设备上还没存到打卡记录。<br>等门户服务器恢复后打开这一页就会自动补上。';
    else msg = '⏳ 正在读取服务器上的打卡记录…';
    box.innerHTML = '<div class="history-head"><span class="h-title">📜 打卡记录</span></div>' +
      '<div class="h-empty">' + msg + '</div>';
    return;
  }
  const wkNames = ['日', '一', '二', '三', '四', '五', '六'];
  let html = '<div class="history-head"><span class="h-title">📜 打卡记录</span>' +
    '<span class="h-count">共 ' + days.length + ' 天</span></div>';
  for (const key of days.slice(0, 30)) {
    const rec = records[key];
    const d = new Date(key + 'T00:00:00');
    const done = dayDone(rec);
    let body;
    if (TAB.type === 'single') {
      if (rec.note) body = '📝 ' + escapeHtml(rec.note);
      else if (rec.voice && rec.voice.url) body = '🎙️ ' + escapeHtml(rec.voice.text || '（录了一段，没听清）');
      else body = done ? '完成打卡' : '留了一条记录';
    } else {
      const names = (rec.items || []).map(id => {
        const it = (TAB.items || []).find(x => x.id === id);
        return it ? it.name : id;
      });
      if (names.length) body = escapeHtml(names.join('、'));
      else if (rec.note) body = '📝 ' + escapeHtml(rec.note);
      else if (rec.voice && rec.voice.url) body = '🎙️ ' + escapeHtml(rec.voice.text || '（录了一段，没听清）');
      else body = done ? '完成打卡' : '留了一条记录';
    }
    html += '<div class="h-item">' +
      '<div class="h-date"><div class="d-day">' + d.getDate() + '</div><div class="d-wk">' + (d.getMonth() + 1) + '月·周' + wkNames[d.getDay()] + '</div></div>' +
      '<div class="h-body"><div class="h-note">' + body + '</div></div>' +
      (done
        ? '<span class="h-tag">✓ 已打卡</span>'
        : '<span class="h-tag note-only">📝 有记录</span>') +
      '</div>';
  }
  box.innerHTML = html;
}

// 一句话记录：写下来或说出来都能记住（说出来的会先被服务器识别成文字，填进输入框）
function saveNoteBox(input, rerender) {
  const key = todayStr();
  const r = records[key] || {};
  r.note = input.value.trim();
  r.ts = nowTs();
  records[key] = r;
  saveRecords();
  speak('记住啦！');
  if (rerender) rerender();
  renderHistory();
  schedulePush();
}

function renderSingle() {
  const today = todayStr();
  const rec = records[today] || {};
  const done = !!rec.done;
  const card = document.getElementById('mainCard');
  card.innerHTML =
    '<div class="big-area">' +
    '<button class="big-btn' + (done ? ' done' : '') + '" id="bigBtn">' +
    '<span>' + (done ? '✅' : TAB.emoji) + '</span><span class="lbl">' + (done ? '已打卡' : '打卡！') + '</span>' +
    '</button>' +
    '<div class="hint">' + (done ? '太棒啦！明天也要坚持哦' : '完成了就点一下大按钮') + '</div>' +
    '<div class="note-box">' +
    '<label>' + rubyHtml(TAB.question || '今天做了什么？') + '</label>' +
    '<div class="note-row"><input id="noteInput" maxlength="140" placeholder="' + escapeHtml(TAB.placeholder || '可以写下来…') + '">' +
    '<button id="noteSave">记住</button></div>' +
    voiceRowHtml(rec) +
    (rec.note ? '<div class="note-show">📝 ' + escapeHtml(rec.note) + '</div>' : '') +
    '</div></div>';
  document.getElementById('bigBtn').addEventListener('click', () => {
    const r = records[today] || {};
    r.done = !r.done;
    r.ts = nowTs();
    records[today] = r;
    saveRecords();
    if (r.done) showCelebration('🎉', TAB.name + '打卡成功，你真棒！');
    renderSingle();
    renderStreak();
    renderHistory();
    schedulePush();
  });
  const input = document.getElementById('noteInput');
  input.value = rec.note || '';
  document.getElementById('noteSave').addEventListener('click', () => saveNoteBox(input, renderSingle));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') saveNoteBox(input, renderSingle); });
  mountNoteVoice();
  bindVoicePlay(card);
}

function renderList() {
  const today = todayStr();
  const rec = records[today] || {};
  const checked = rec.items || [];
  const items = TAB.items || [];
  const card = document.getElementById('mainCard');
  card.innerHTML =
    '<div class="progress-line">' + rubyHtml('已完成') + ' ' + checked.length + ' / ' + items.length + '</div>' +
    items.map(it => {
      const done = checked.indexOf(it.id) >= 0;
      return '<div class="item' + (done ? ' done' : '') + '" data-item="' + escapeHtml(it.id) + '">' +
        '<span class="i-emoji">' + (it.emoji || '⭐') + '</span>' +
        '<span class="i-name">' + rubyHtml(it.name) + '</span>' +
        '<span class="i-check">' + (done ? '✓' : '') + '</span>' +
        '</div>';
    }).join('') +
    '<div class="note-box"><label>' + rubyHtml(TAB.question || '今天做了什么？') + '</label>' +
    '<div class="note-row"><input id="noteInput" maxlength="140" placeholder="' + escapeHtml(TAB.placeholder || '可以写下来…') + '">' +
    '<button id="noteSave">记住</button></div>' +
    voiceRowHtml(rec) +
    (rec.note ? '<div class="note-show">📝 ' + escapeHtml(rec.note) + '</div>' : '') +
    '</div>';
  card.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-item');
      const r = records[today] || {};
      let list = (r.items || []).slice();
      const idx = list.indexOf(id);
      if (idx >= 0) list.splice(idx, 1);
      else list.push(id);
      r.items = list;
      r.ts = nowTs();
      records[today] = r;
      saveRecords();
      if (list.length === items.length && items.length > 0) {
        showCelebration('🏆', TAB.name + '全部完成，你是小能手！');
      } else if (idx < 0) {
        speak('打卡成功！');
      }
      renderList();
      renderStreak();
      renderHistory();
      schedulePush();
    });
  });
  const input = document.getElementById('noteInput');
  if (input) {
    input.value = rec.note || '';
    document.getElementById('noteSave').addEventListener('click', () => saveNoteBox(input, renderList));
    input.addEventListener('keydown', e => { if (e.key === 'Enter') saveNoteBox(input, renderList); });
  }
  mountNoteVoice();
  bindVoicePlay(card);
}

// 书单：每本书逐章勾选。勾完一章书不会自动收起，只有点书头（或点折叠）才收起。

function updateProgressLine() {

function updateBookSub(bookId) {

function renderProgress() {
  const today = todayStr();
  const progress = loadProgress();
  const items = TAB.items || [];

    doneChapters += chapList(progress, it.id).length;

    '<div class="progress-line">' + rubyHtml('累计读完') + ' ' + doneChapters + ' / ' + totalChapters + ' ' + rubyHtml('章') + '</div>' +
    items.map(it => {
      const book = BOOKLIST.find(b => b.id === it.id);
      const chaps = (book && book.chapters) || [];
      const done = chapList(progress, it.id);
      const chapHtml = chaps.length
        ? chaps.map((c, i) =>
          '<div class="chap' + (done.indexOf(i) >= 0 ? ' done' : '') + '" data-book="' + escapeHtml(it.id) + '" data-idx="' + i + '">' +
          '<span class="c-check">' + (done.indexOf(i) >= 0 ? '✓' : '') + '</span>' +
          '<span class="c-name">' + rubyHtml(c) + '</span>' +
          '</div>').join('')
        : '<div class="empty-tip">目录待补充<br>把这本书的目录页拍照发给我吧</div>';
      return '<div class="book' + (openBooks.has(it.id) ? ' open' : '') + '" data-bookwrap="' + escapeHtml(it.id) + '">' +
        '<div class="book-head" data-toggle="' + escapeHtml(it.id) + '">' +
        '<span class="i-emoji">' + (it.emoji || '📖') + '</span>' +
        '<span class="b-title"><span class="b-name">' + rubyHtml(it.name) + '</span>' +
        '<span class="b-sub">' + escapeHtml(bookSubHtml(book, done.length, chaps.length)) + '</span></span>' +
        '<span class="b-arrow">▾</span>' +
        '</div>' +
        '<div class="chapters">' + chapHtml + '</div>' +
        '</div>';
    }).join('');
  // 展开/收起：只由点击书头触发，记住展开状态，勾选章节不会把书收起来
  card.querySelectorAll('.book-head').forEach(h => {
    h.addEventListener('click', () => {
      const id = h.getAttribute('data-toggle');
      const w = card.querySelector('.book[data-bookwrap="' + id + '"]');
      if (!w) return;
      if (w.classList.toggle('open')) openBooks.add(id);
      else openBooks.delete(id);
      saveOpen();
    });
  });
  // 逐章勾选：只改这一行，不整页重画（重画会连带收起书、还会把页面滚回顶部）
  card.querySelectorAll('.chap').forEach(el => {
    el.addEventListener('click', () => {
      const bookId = el.getAttribute('data-book');
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      const p = loadProgress();
      const cur = p[bookId] || { chapters: [], ts: 0 };
      const list = cur.chapters.slice();
      const pos = list.indexOf(idx);
      const nowDone = pos < 0;
      const chaps = ((BOOKLIST.find(b => b.id === bookId) || {}).chapters) || [];
      if (nowDone) {
        list.push(idx);
        // 整本读完了就把话留给"这本书读完啦"的庆祝，否则念这一章的名字
        if (!(chaps.length > 0 && list.length === chaps.length)) speakChapter(bookId, idx);
      } else { list.splice(pos, 1); speak('已取消，没关系！'); }
      p[bookId] = { chapters: list, ts: nowTs() };
      saveProgress(p);
      el.classList.toggle('done', nowDone);
      const mark = el.querySelector('.c-check');
      if (mark) mark.textContent = nowDone ? '✓' : '';
      updateBookSub(bookId);
      updateProgressLine();
      if (nowDone) {
        const rec = records[today] || {};
        rec.done = true;
        rec.ts = nowTs();
        records[today] = rec;
        saveRecords();
      }
      renderStreak();
      renderHistory();
      schedulePush();
    });
  });
}

function renderMain() {
  if (TAB.type === 'single') renderSingle();
  else if (TAB.type === 'progress') renderProgress();
  else renderList();
}

/** 整页重画（同步到别的设备上的改动时用），保留当前滚动位置与书的展开状态 */
function refreshAll() {
  const active = document.activeElement;
  // 正在输入时不打扰主卡（比如家长正在写打卡内容、录音文字刚填进输入框），
  // 但下面只读的「打卡记录」照旧重画 —— 它不需要保焦点，不能跟着一起被跳过，
  // 否则点开记录本后同步到了新数据也刷不出来（看起来一直是空的）。
  const typing = active && active.tagName === 'INPUT' && document.body.contains(active);
  const y = window.scrollY;
  renderStreak();
  if (!typing) renderMain();
  renderHistory();
  if (y) window.scrollTo(0, y);
}


async function init() {
  const err = document.getElementById('errTip');
  // 「读书」与「书单」已合并成一个页面（web/reading.html）：老地址、老书签自动跳过去，
  // 不会再看到两个分开的打卡页。
  const MERGED = { reading: 'reading', booklist: 'booklist' };
  if (MERGED[TAB_ID]) {
    location.replace('/web/reading.html?id=reading&mode=' + MERGED[TAB_ID]);
    return;
  }
  try {
    const res = await fetch('/api/home', { cache: 'no-store' });
    const data = await res.json();
    CONFIG = data.config || {};
    BOOKLIST = ((data.booklist || {}).books) || [];
    TAB = ((data.activities || {}).tabs || []).find(t => t.id === TAB_ID);
    if (!TAB) throw new Error('未找到标签页配置: ' + TAB_ID);
  } catch (e) {
    err.style.display = 'block';
    if (!TAB_ID) {
      err.textContent = '这个地址少了标签页参数（?id=…）。请从首页的「读书 / 家务 / 运动」等标签进入，' +
        '或把地址写成 /web/tracker.html?id=sports（运动）、?id=chores（家务）、?id=reading（读书）。';
    } else {
      err.textContent = '加载失败：请确认门户服务器已启动，且 activities.json 中有 "' + TAB_ID + '" 配置。';
    }
    return;
  }
  document.title = TAB.name + '打卡';
  document.getElementById('hero').style.setProperty('--c', TAB.color);
  document.getElementById('heroEmoji').textContent = TAB.emoji;
  document.getElementById('heroName').innerHTML = rubyHtml(TAB.name);
  document.getElementById('heroGoal').innerHTML = rubyHtml(TAB.goal || '');
  document.getElementById('app').style.display = 'block';
  loadRecords();
  loadOpen();
  renderStreak();
  renderMain();
  renderHistory();
  initRecorder();
  document.getElementById('histToggle').addEventListener('click', toggleHistory);
  // 先拉服务器上的最新状态（另一台设备勾的也算数），再刷新界面
  setSyncTip('syncing');
  syncNow(false).then(() => refreshAll());
  startSyncLoop();
}

init();

if (window.GrowthThemes) {
  const syncHeroDeco = t => {
    const ds = document.querySelectorAll('#hero .deco');
    if (t && t.deco && ds.length) ds.forEach((el, i) => { el.textContent = t.deco[i % t.deco.length]; });
  };
  syncHeroDeco(GrowthThemes.THEMES[GrowthThemes.current()]);
  document.addEventListener('themechange', e => syncHeroDeco(e.detail));
}
</script>
